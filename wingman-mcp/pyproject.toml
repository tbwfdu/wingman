[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingman-mcp"
version = "0.5.6"
description = "Local MCP server for Omnissa product documentation search and API tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Base install is intentionally light so dependents (e.g. wingman-mcp-bridge)
# that only need the credential schema don't pull the RAG stack. Install the
# full local product with the [rag] extra: pip install wingman-mcp[rag]
dependencies = [
    "mcp[cli]>=1.0.0",
    "keyring>=25.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-chroma>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
wingman-mcp = "wingman_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "strict"
markers = [
    "asyncio: mark test as an asyncio coroutine",
]
