[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingman-mcp-bridge"
version = "0.5.5"
description = "Local stdio bridge to a remote, Entra-protected wingman-mcp server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    # The bridge reuses the credential schema from the public package.
    # In dev, install it editable first: pip install -e ../wingman-mcp
    # For release, pin a git tag, e.g.
    #   wingman-mcp @ git+https://github.com/tbwfdu/wingman.git@v0.5.5
    "wingman-mcp>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
wingman-mcp-bridge = "wingman_mcp_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman_mcp_bridge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "strict"
markers = [
    "asyncio: mark test as an asyncio coroutine",
]
